kotlin.code.style=official
org.gradle.jvmargs=-Dkotlin.daemon.jvm.options\="-Xmx8096M"
org.gradle.configuration-cache=true
android.nonTransitiveRClass=true
android.useAndroidX=true

# Dexing library modules through artifact transforms leaves stale per-class dex
# files behind when a class with inner classes changes: the old ReaderState.dex
# still holds ReaderState$1, the new one ships it separately, and mergeLibDex
# aborts with "Type ... is defined multiple times". It happened on every build
# that touched ReaderState or AndroidReaderImage, and the only cure was stopping
# the daemon and deleting build/.transforms by hand. Non-incremental dexing of
# library modules costs a little build time and removes the failure mode.
android.enableIncrementalDexingTransform=false

# TODO remove after https://youtrack.jetbrains.com/issue/KT-63353/K2-KMP-Incremental-compilation
# incremental build is disabled by default as a workaround for the bug https://youtrack.jetbrains.com/issue/KT-62686
kotlin.internal.incremental.enableUnsafeOptimizationsForMultiplatform=true

# build variants that enables/disables variant specific features
# standalone, fdroid or play
snd.android.variant="standalone"