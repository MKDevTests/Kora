kotlin.code.style=official
# Sized against the WSL VM this is built in, which .wslconfig caps at 12 GB.
#
# The old line set only -Dkotlin.daemon.jvm.options=-Xmx8096M: the Kotlin daemon
# was allowed two thirds of the whole VM while the Gradle daemon, which runs AGP
# and dexing, was left on the JVM default. The two together overcommitted the VM
# and the build went to swap. 3 + 4 GB leaves five for AGP's workers and the OS.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dkotlin.daemon.jvm.options\="-Xmx4g"
org.gradle.configuration-cache=true
# 29 modules built one after another. Worth having even at four cores, and worth
# much more once .wslconfig stops capping WSL at four of the machine's sixteen.
org.gradle.parallel=true
org.gradle.caching=true
android.nonTransitiveRClass=true
android.useAndroidX=true

# TODO remove after https://youtrack.jetbrains.com/issue/KT-63353/K2-KMP-Incremental-compilation
# incremental build is disabled by default as a workaround for the bug https://youtrack.jetbrains.com/issue/KT-62686
kotlin.internal.incremental.enableUnsafeOptimizationsForMultiplatform=true

# build variants that enables/disables variant specific features
# standalone, fdroid or play
snd.android.variant="standalone"