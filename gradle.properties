kotlin.code.style=official
# Sized against the WSL VM this is built in, which .wslconfig caps at 12 GB --
# of the machine's 15.7, so Windows itself is living on the remaining 3.7 and
# there is nowhere to borrow from.
#
# The first version of this line set only -Dkotlin.daemon.jvm.options=-Xmx8096M:
# the Kotlin daemon was allowed two thirds of the whole VM while the Gradle
# daemon, which runs AGP and dexing, was left on the JVM default. The two
# together overcommitted the VM and the build went to swap.
#
# 3 + 4 GB was the correction, on the reasoning that five were left for AGP's
# workers and the OS. Measured mid-build, the VM was already 6 GB used with 4
# free, so those five were never there — and with parallel builds both daemons
# climb toward their ceilings at once. The symptom was a build that died once
# and carried on: the Kotlin daemon being killed and restarted.
#
# 2 GB for the Kotlin daemon. Raise it again only against a measurement, and
# the measurement to take is `free -g` while a build is running, not the build
# time alone.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dkotlin.daemon.jvm.options\="-Xmx2g"
org.gradle.configuration-cache=true
# 29 modules built one after another. .wslconfig now gives WSL 12 of the
# machine's 16 cores, so this earns its keep — but it is also what has both
# daemons growing at the same time, which is why the heaps above are sized for
# them running together rather than in turn.
org.gradle.parallel=true
# Reuses task output across branches, which is most of the cost of switching.
# It was off for a while because it undid the stale-dex recovery in
# scripts/build-kora-debug.sh — the purge deleted the bad output and the cache
# handed the same one straight back. The recovery retries with
# --no-build-cache now, so the two no longer fight.
org.gradle.caching=true

# The build cache was turned on here too and had to come back off. The recovery
# for the recurring "Type ... is defined multiple times" dex failure is to delete
# the module's build dir and let it recompile; with the cache on, Gradle restored
# compileDebugKotlinAndroid FROM-CACHE instead, so the purge did nothing and the
# same transform hash came back twice in a row.
# org.gradle.caching=true

# mergeLibDexDebug kept dying on ReaderState$1 and AndroidReaderImage$2 being
# defined twice: the dexing transform sees each library on its own, so a class
# and its inner classes can be dexed by two runs that do not know about each
# other. Giving the transform the full classpath is the fix AGP itself points
# to; android.enableDexingArtifactTransform, the older switch, was removed in
# AGP 8.3 and now fails the build outright.
android.useFullClasspathForDexingTransform=true
android.nonTransitiveRClass=true
android.useAndroidX=true

# TODO remove after https://youtrack.jetbrains.com/issue/KT-63353/K2-KMP-Incremental-compilation
# incremental build is disabled by default as a workaround for the bug https://youtrack.jetbrains.com/issue/KT-62686
#
# Off since 2026-08-15. mergeLibDexDebug kept failing with "Type
# snd.komelia.ui.reader.image.ReaderState$1 is defined multiple times", and the
# two dex files it named came from the SAME transform directory — so this was
# never the cross-library duplication that
# android.useFullClasspathForDexingTransform above already fixes. One transform
# output holding the class twice is a stale incremental result, and the flag
# named "unsafe optimizations" is the one producing them. It landed on
# ReaderState because that is the file being edited most.
#
# The cost of it being off is slower incremental Kotlin compilation. The cost of
# it being on was a build that failed and needed the purge-and-retry recovery in
# scripts/build-kora-debug.sh, repeatedly, which is far more expensive.
#
# Turn it back on only if a full clean build is measurably faster with it AND
# the dex failure does not return within a few days of normal editing.
# kotlin.internal.incremental.enableUnsafeOptimizationsForMultiplatform=true

# build variants that enables/disables variant specific features
# standalone, fdroid or play
snd.android.variant="standalone"